<div class="col-span-2">
  <!-- characters bars -->
  <app-progress-bar
    data-tour="hp"
    [progress]="hpPercent()"
    [style]="'progress-success'"
    [text]="'HP ' + characters().hp()"
    [hits]="characters().hitEvents"
  ></app-progress-bar>

  <app-progress-bar
    data-tour="mp"
    [progress]="mpPercent()"
    [style]="'progress-info'"
    [text]="'MP ' + characters().mp()"
  ></app-progress-bar>

  <app-progress-bar
    data-tour="limit"
    [progress]="limitPercent()"
    [style]="'progress-warning'"
    [text]="'LIMIT ' + limitPercent() + '%'"
  ></app-progress-bar>

  <!-- characters list -->
  <div data-tour="team">
    @for (character of characters().team(); track character) {
    <div class="flex gap-3 mt-3 sm:gap-4 sm:mt-5">
      <div
        [style]="{ 'background-image': 'url(' + character.image + ')' }"
        class="relative flex-none w-14 h-14 bg-center bg-cover border border-black sm:w-20 sm:h-20"
      >
        <div
          class="absolute bottom-0 left-0 right-0 text-center bg-black opacity-75 leading-tight sm:h-5"
        >
          <span class="text-xs text-white sm:text-sm">
            LVL{{ character.level }}
          </span>
        </div>
      </div>
      <div class="min-w-0 grow">
        <app-progress-bar
          [progress]="character.xpProgress()"
          [text]="character.xp + ' / ' + character.getXpMax() + 'EXP'"
        ></app-progress-bar>
        <div class="text-lg leading-tight sm:text-2xl">{{ character.ref }}</div>
        <div class="text-xs italic truncate sm:text-sm sm:whitespace-normal">
          "{{ getLine(character) | translate }}"
        </div>
      </div>
    </div>
    }
  </div>
</div>
