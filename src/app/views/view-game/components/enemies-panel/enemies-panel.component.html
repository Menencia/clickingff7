<!-- The HP and badges rows are always there (hidden without an enemy), so that
     the panel keeps its height when an enemy shows up. -->
<div class="flex flex-col items-center gap-2" data-tour="enemies">
  @if (enemies().list.length > 0) {
  <!-- enemies portraits, with their HP around -->
  <app-radial-gauge
    class="size-32"
    color="text-error"
    [progress]="hpPercent()"
    [label]="'HP ' + enemies().hp()"
    [hits]="enemies().hitEvents"
  >
    <div
      class="flex size-[86%] overflow-hidden rounded-full transition duration-700"
      [class.defeated]="enemies().hp() === 0"
    >
      @for (enemy of enemies().list; track enemy) {
      <div
        class="h-full flex-1 bg-cover bg-center"
        [style.background-image]="'url(' + enemy.image + ')'"
      ></div>
      }
    </div>
  </app-radial-gauge>
  } @else {
  <div
    class="flex size-32 items-center justify-center rounded-full border-2 border-dashed border-base-300 p-4 text-center text-xs uppercase opacity-60"
  >
    {{ "No enemies" | translate }}
  </div>
  }
  <div
    class="text-sm font-bold leading-none"
    [class.invisible]="enemies().list.length === 0"
    data-testid="enemies-hp"
  >
    HP {{ enemies().hp() }}
  </div>
  <div class="flex min-h-4 flex-wrap justify-center gap-1">
    @for (enemy of enemies().list; track enemy) {
    <span class="badge badge-xs badge-neutral">LVL{{ enemy.level }}</span>
    @if (enemy.boss) {
    <span class="badge badge-xs badge-error">ZONE BOSS</span>
    } @if (enemy.miboss) {
    <span class="badge badge-xs badge-error">BOSS</span>
    } }
  </div>
</div>
