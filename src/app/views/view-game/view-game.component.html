<app-ui-layout-default>
  <div class="flex flex-col gap-5 sm:flex-row">
    <app-ui-actions class="basis-1/5"></app-ui-actions>
    <div class="basis-2/5">
      <app-characters-panel [characters]="characters"></app-characters-panel>
    </div>
    <div class="basis-2/5">
      @let e = enemies(); @if(e) {
      <app-enemies-panel [enemies]="e"></app-enemies-panel>
      }
    </div>
  </div>
</app-ui-layout-default>
