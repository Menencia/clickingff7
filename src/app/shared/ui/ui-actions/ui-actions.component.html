<div class="flex flex-row flex-wrap gap-1 sm:flex-col">
  <button
    type="button"
    class="btn"
    (click)="fightRandom()"
    [disabled]="isBattle()"
    id="step6"
  >
    {{ "Fight random" | translate }}{{ remainingBattles() }}
  </button>
  <button
    class="btn"
    type="button"
    (click)="fightBoss()"
    [disabled]="!canFightBoss()"
  >
    @if (canFightBoss()) {
    <div class="float-right text-red-700">NEW</div>
    }
    {{ "Fight boss" | translate }}
  </button>
  <button
    type="button"
    class="btn"
    (click)="attack()"
    [disabled]="!isBattle()"
    id="step7"
  >
    @if (!canLimit()) {
    <span>{{ "Attack" | translate }}</span>
    } @if (canLimit()) {
    <span>{{ "Limit" | translate }}</span>
    }
  </button>
  <button
    type="button"
    class="btn"
    (click)="escape()"
    [disabled]="!isBattle()"
    id="step8"
  >
    {{ "Escape" | translate }}
  </button>

  <div class="h-3"></div>

  <div [id]="'step9'" class="contents">
    @for (materia of getMaterias(); track materia) {
    <button
      type="button"
      class="btn flex flex-row items-center"
      (click)="useMateria(materia)"
      [disabled]="!canUseMateria(materia)"
    >
      <img
        class="flex-none"
        src="/assets/images/icons/materias/{{ materia.color }}.webp"
        alt="materia"
      >
      <div class="grow">
        {{ "Mat. " + materia.ref + " name" | translate }}
      </div>
      <span class="flex-none">{{ materia.getMpCost() }}</span>
    </button>
    }
  </div>

  @if (getItems().length > 0) {
  <div [id]="'step10'" class="contents">
    <div class="h-3"></div>
    @for (item of getItems(); track item) {
    <button
      type="button"
      class="btn flex flex-row items-center button"
      (click)="useItem(item)"
      [disabled]="!canUseItem(item)"
    >
      <div class="grow">
        {{ "It. " + item.ref + " name" | translate }}
      </div>
      <div class="flex-none">{{ item.nbr }}</div>
    </button>
    }
  </div>
  }

  <div class="h-3"></div>

  <div class="text-center">{{ "Gil" | translate }}: {{ getGils() }}</div>
  <div class="text-center" id="step11">
    {{ "Zone " + getZoneLvl() + " name" | translate }}
    <strong> (#{{ getZoneLvl() }}) </strong>
  </div>
</div>
