<div class="relative mb-2">
  <div class="progress-label text-right text-xs leading-tight opacity-80">
    {{ text() }}
  </div>
  <progress
    class="progress block {{style()}}"
    [value]="progress()"
    max="100"
  ></progress>
  @for (hits of arrHits(); track hits) {
  <div
    class="hits absolute right-0 top-0 text-error text-3xl"
    (animationend)="onAnimationEvent()"
  >
    {{ hits.hits }}
  </div>
  }
</div>
